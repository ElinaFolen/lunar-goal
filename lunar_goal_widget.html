document.getElementById("title").textContent=CONFIG.TITLE;
function render(raised,goal){
 raised=Number(raised)||0; goal=Number(goal)||1;
 const filled=Math.round(Math.max(0,Math.min(1,raised/goal))*CONFIG.MOONS);
 const box=document.getElementById("moons"); box.innerHTML="";
 for(let i=0;i<CONFIG.MOONS;i++){let x=document.createElement("img");x.className="moon "+(i<filled?"filled":"empty");x.src=MOON;x.alt="Луна";box.appendChild(x)}
 document.getElementById("numbers").textContent=raised.toLocaleString("ru-RU")+" / "+goal.toLocaleString("ru-RU")+" ₽";
}
render(CONFIG.FALLBACK_RAISED,CONFIG.FALLBACK_GOAL);
function token(){return new URLSearchParams(location.hash.replace(/^#/,"")).get("access_token")}
function login(){
 const scopes=encodeURIComponent("oauth-user-show oauth-goal-subscribe");
 location.href="https://www.donationalerts.com/oauth/authorize?client_id="+encodeURIComponent(CONFIG.CLIENT_ID)+"&redirect_uri="+encodeURIComponent(CONFIG.REDIRECT_URI)+"&response_type=token&scope="+scopes;
}
async function api(path){
 const r=await fetch("https://www.donationalerts.com/api/v1"+path,{headers:{Authorization:"Bearer "+token()}});
 if(!r.ok)throw Error("API "+r.status); return r.json();
}
async function connect(){
 if(!token()){
  document.getElementById("status").textContent="Нужна авторизация DonationAlerts";
  if(CONFIG.CLIENT_ID!=="ВСТАВЬ_CLIENT_ID"){let b=document.createElement("button");b.textContent="Подключить DonationAlerts";b.onclick=login;document.querySelector(".widget").appendChild(b)}
  return;
 }
 try{
  const me=await api("/user/oauth"), user=me.data;
  const ws=new WebSocket("wss://centrifugo.donationalerts.com/connection/websocket");
  ws.onopen=()=>ws.send(JSON.stringify({params:{token:user.socket_connection_token},id:1}));
  ws.onmessage=async e=>{
   const msg=JSON.parse(e.data);
   if(msg.id===1&&msg.result&&msg.result.client){
    const r=await fetch("https://www.donationalerts.com/api/v1/centrifuge/subscribe",{method:"POST",
      headers:{Authorization:"Bearer "+token(),"Content-Type":"application/json"},
      body:JSON.stringify({channels:["$goals:goal_"+user.id],client:msg.result.client})});
    if(!r.ok)throw Error("Subscribe "+r.status);
    const d=await r.json(), ch=d.channels&&d.channels[0]; if(!ch)throw Error("Нет токена канала");
    ws.send(JSON.stringify({params:{channel:ch.channel,token:ch.token},method:1,id:2}));
    document.getElementById("status").textContent="Цель подключена";
   }
   if(msg.result&&msg.result.data){
    const d=msg.result.data;
    if(d.raised_amount!==undefined&&d.goal_amount!==undefined){
      render(d.raised_amount,d.goal_amount);
      document.getElementById("title").textContent=d.title||CONFIG.TITLE;
      document.getElementById("status").textContent=d.is_active?"Цель активна":"Цель завершена";
    }
   }
  };
  ws.onerror=()=>document.getElementById("status").textContent="Ошибка WebSocket";
 }catch(e){console.error(e);document.getElementById("status").textContent="Ошибка: "+e.message}
}
connect();
</script></body></html>
